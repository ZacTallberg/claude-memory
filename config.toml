# claude-memory configuration. Built-in defaults < this file < config.local.toml (gitignored,
# per-machine sizing) < CLAUDEMEM_* env vars.
# Secrets (DB password, API keys) come from the environment, never this file.

[scope]
# These are user-level hooks installed into trusted local agent clients, so memory is active in
# every context those clients open (including projectless Codex tasks under Documents). Switch to
# "workspace_roots" only when deliberately constraining delivery to the roots below.
activation = "installed_clients" # "installed_clients" | "workspace_roots"
workspace_roots = ["C:/code"]
# Canonical, client-neutral curated-note store defaults to <home>/.agent-memory/notes. Direct .md
# files are global; each child directory is a project. CLAUDEMEM_MEMORY_ROOT overrides the default.
# Index and update historical ~/.claude/projects/*/memory notes during migration.
include_legacy_claude_notes = true
# claude_projects_dir defaults to <home>/.claude/projects — set it here only if yours differs.
# Codex session rollouts are indexed alongside Claude transcripts. This path defaults to
# <home>/.codex and can also be overridden with CLAUDEMEM_CODEX_HOME.

[store]
backend = "sqlite"           # "postgres" | "sqlite" | "auto" — auto forks the store into two diverging copies whenever ParadeDB flaps; keep pinned to one backend

[store.postgres]
host = "localhost"
port = 55432
dbname = "claudemem"
user = "claudemem"
# password via env CLAUDEMEM_PG_PASSWORD (dev default "claudemem")

[store.sqlite]
path = "data/claudemem.db"

[embeddings]
provider = "local"          # "local" | "ollama" | "voyage" | "cohere"
model = "BAAI/bge-small-en-v1.5"   # guaranteed in fastembed; upgrade via this key
dim = 384                   # stored embedding dimension (Matryoshka-truncate if model is larger)
query_prefix = ""
doc_prefix = ""
document_microbatch_size = 4 # yield the serialized ONNX lane to waiting prompt queries frequently

[reranker]
enabled = true
provider = "local"          # "local" (fastembed cross-encoder) | "cohere" | "none"
model = "Xenova/ms-marco-MiniLM-L-6-v2"
hot_path = false            # CPU box: do NOT rerank on the prompt hot path by default
candidates = 30             # fused candidates to rerank on the full/on-demand path

[contextual]
enabled = false             # Anthropic Contextual Retrieval at index time — needs ANTHROPIC_API_KEY
                            # in the hook/index environment (none on this box); paid API per chunk
model = "claude-haiku-4-5"
enrich_notes = true         # always enrich curated notes (small, high value)
enrich_transcripts = false  # off by default (volume); flip on or sample later
max_doc_chars = 60000

[consolidation]
# Background, review-first formation of typed semantic/episodic/procedural memories. This runs
# only after indexing, at most daily; it never executes on a prompt and never auto-accepts a note.
enabled = true
auto_after_index = true
min_interval_hours = 24
candidate_cap = 15

[recall]                    # hot path (UserPromptSubmit)
top_k = 6
bm25_k = 40
vector_k = 40
rrf_k = 60
min_terms = 3
max_chars = 8000
recency_half_life_days = 45
snippet_chars = 600
include_facts = true
facts_k = 4

[unify]                     # session start (SessionStart)
max_facts = 300
group_by = "project"        # "project" | "type"

[delivery]
# The server must give up before its caller does, leaving enough time for a keyword fallback and
# an end-to-end delivery receipt. These are prompt-path budgets, not model-quality settings.
client_timeout_seconds = 8.0
server_deadline_seconds = 6.0
receipt_timeout_seconds = 0.75
hook_concurrency = 4
hybrid_slo_ms = 3000

[server]
host = "127.0.0.1"
port = 7777
open_browser = true

[index]
exclude_sidechains = true
strip_injected = true
tool_blobs = false          # store compact tool summaries, not full tool blobs
batch_size = 64
transcript_providers = ["claude", "codex"]  # shared corpus; provider adapters normalize both
live_interval_seconds = 60  # warm-server incremental sync so active workers can recall one another
