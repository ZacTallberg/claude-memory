[project]
name = "system-memory"
version = "0.1.0"
description = "System-wide, provider-neutral memory for local AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mcp>=1.23,<2",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sqlite-vec==0.1.6",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
local-models = [
  "fastembed==0.7.3",
  "numpy==2.3.2",
]
otel = [
  "opentelemetry-api==1.36.0",
  "opentelemetry-exporter-otlp-proto-http==1.36.0",
  "opentelemetry-instrumentation-fastapi==0.57b0",
  "opentelemetry-sdk==1.36.0",
]
dev = [
  "coverage[toml]==7.10.2",
  "hypothesis==6.138.3",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.8",
]

[project.scripts]
system-memory = "system_memory.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_memory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["system_memory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

