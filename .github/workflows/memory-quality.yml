name: Memory quality (offline)

# Deliberately off the prompt and merge critical paths. This catches environmental drift and
# deep regressions without making every agent interaction or small commit pay the model-load cost.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"

permissions:
  contents: read

jobs:
  full-selftest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked environment
        run: python -m pip install -r requirements-lock.txt
      - name: Install harness
        run: python -m pip install --no-deps -e .
      - name: Compile source
        run: python -m compileall -q claudemem hooks
      - name: Run regression self-test
        run: mem selftest
